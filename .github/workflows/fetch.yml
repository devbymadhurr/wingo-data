name: WinGo Collector Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright

      - name: Install Chromium (only if not cached)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run cron via real browser
        env:
          WINGO_CRON_KEY: ${{ secrets.WINGO_CRON_KEY }}
        run: |
          cat > fetch-cron.js << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const url = `https://paiwingoongo.byethost24.com/index.php?cron=1&key=${process.env.WINGO_CRON_KEY}`;
            await page.goto(url, { waitUntil: 'load', timeout: 30000 });
            await page.waitForTimeout(3000);
            console.log('Final URL:', page.url());
            console.log('Body:', await page.textContent('body'));
            await browser.close();
          })();
          EOF
          node fetch-cron.js
