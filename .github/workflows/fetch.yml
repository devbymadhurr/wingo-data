name: WinGo Collector Cron

on:
  schedule:
    # GitHub Actions' minimum reliable interval is ~5 minutes.
    # Cron syntax: minute hour day month weekday
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  ping-collector:
    runs-on: ubuntu-latest
    steps:
      - name: Call the collector cron endpoint
        run: |
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36" \
            "https://paiwingoongo.byethost24.com/index.php?cron=1&key=${{ secrets.WINGO_CRON_KEY }}")
          echo "HTTP status: $RESPONSE"
          echo "---- Response body ----"
          cat response.json
          if [ "$RESPONSE" -lt 200 ] || [ "$RESPONSE" -ge 300 ]; then
            echo "::warning::Cron call returned HTTP $RESPONSE"
          fi
